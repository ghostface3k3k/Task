type Localization {
  name: String!
  description: String!
}

type ParentDepartment {
  id: ID!
  name: String!
}

type Employee {
  id: ID!
  name: String!
  role: String!
  contact: String!
}

type Department {
  id: ID!
  name: String!
  description: String!
  localization: Localization!
  code: Int!
  manager: String!
  location: String!
  employeesNumber: Int!
  status: Boolean!
  parentDepartment: ParentDepartment
  createdAt: String!
  employees: [Employee!]!
}

type Query {
  getDepartment(id: ID!): Department
  getAllDepartments: [Department!]!
  getEmployees(departmentId: ID!): [Employee!]!
}

input LocalizationInput {
  name: String!
  description: String!
}

input UpdateDepartmentInput {
  name: String
  description: String
  localization: LocalizationInput
  manager: String
  location: String
  status: Boolean
}

input AddEmployeeInput {
  name: String!
  role: String!
  contact: String!
}

type Mutation {
  updateDepartment(id: ID!, input: UpdateDepartmentInput!): Department!
  deleteEmployee(departmentId: ID!, employeeId: ID!): Boolean!
  addEmployee(departmentId: ID!, input: AddEmployeeInput!): Employee!
}
